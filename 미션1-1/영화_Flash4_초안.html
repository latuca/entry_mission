<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아늑한 벽난로 영화 티어리스트</title>
  <style>
    :root {
      --bg-wood-deep: #1a0f0a;
      --bg-wood-mid: #2c1810;
      --bg-wood-card: #3a2218;
      --border-wood: #5a3825;
      --gold-accent: #e5a93b;
      --gold-glow: rgba(229, 169, 59, 0.35);
      --wine-red: #721b24;
      --forest-green: #1c3b2b;
      --amber-light: #f5c26b;
      --text-main: #f5ebe0;
      --text-muted: #cbb89d;
      
      --tier-s: #b83232;
      --tier-a: #c96827;
      --tier-b: #bfa134;
      --tier-c: #3d7355;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #2f1910 0%, #170d08 75%, #0d0604 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    /* Cozy Fireplace Ambient Glow Effect */
    body::before {
      content: "";
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 350px;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.15) 0%, rgba(184, 50, 50, 0.05) 50%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 16px 10px;
      border-bottom: 2px solid var(--border-wood);
      position: relative;
    }

    .header-tag {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--gold-accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      color: #fff4e6;
      text-shadow: 0 2px 12px var(--gold-glow), 0 0 30px rgba(229, 100, 30, 0.25);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      word-break: keep-all;
    }

    /* Toolbar / Controls */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: rgba(44, 24, 16, 0.7);
      border: 1px solid var(--border-wood);
      padding: 12px 18px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .tool-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn-wood {
      background: linear-gradient(180deg, #44271c, #321b13);
      border-color: #633e2b;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 2px 4px rgba(0,0,0,0.3);
    }

    .btn-wood:hover {
      background: linear-gradient(180deg, #523023, #3a2016);
      border-color: var(--gold-accent);
      color: var(--amber-light);
    }

    .btn-wine {
      background: linear-gradient(180deg, #8a2430, #61151d);
      border-color: #a83644;
    }

    .btn-wine:hover {
      background: linear-gradient(180deg, #a32c3a, #771a24);
      box-shadow: 0 0 12px rgba(184, 50, 50, 0.4);
    }

    .btn-green {
      background: linear-gradient(180deg, #24523a, #163625);
      border-color: #357352;
    }

    .btn-green:hover {
      background: linear-gradient(180deg, #2c6648, #1c452f);
      box-shadow: 0 0 12px rgba(45, 115, 85, 0.4);
    }

    /* Tier Board */
    #tier-board-wrapper {
      background: #20110b;
      border: 2px solid var(--border-wood);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      margin-bottom: 28px;
    }

    .tier-board-header {
      background: linear-gradient(90deg, #2a150d, #3c1e13, #2a150d);
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--amber-light);
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-wood);
    }

    .tier-row {
      display: flex;
      min-height: 125px;
      border-bottom: 2px solid rgba(90, 56, 37, 0.6);
      background-color: #27140d;
      transition: background-color 0.2s;
    }

    .tier-row:last-child {
      border-bottom: none;
    }

    .tier-label {
      width: 100px;
      min-width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      border-right: 2px solid var(--border-wood);
      letter-spacing: 1px;
    }

    .tier-s .tier-label { background: linear-gradient(135deg, #c92a2a, #841b1b); }
    .tier-a .tier-label { background: linear-gradient(135deg, #d97724, #944b0e); }
    .tier-b .tier-label { background: linear-gradient(135deg, #caa329, #876911); }
    .tier-c .tier-label { background: linear-gradient(135deg, #2f7a4e, #1a4a2e); }

    .tier-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: center;
      gap: 12px;
      padding: 12px;
      min-height: 125px;
      background-color: rgba(30, 16, 11, 0.7);
    }

    .tier-items.drag-over {
      background-color: rgba(229, 169, 59, 0.15);
      outline: 2px dashed var(--gold-accent);
      outline-offset: -3px;
    }

    /* Unranked Pool (보관함) */
    .pool-section {
      background: #20110b;
      border: 2px solid var(--border-wood);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .pool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pool-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--amber-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pool-badge {
      background: var(--bg-wood-card);
      border: 1px solid var(--border-wood);
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pool-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 120px;
      padding: 14px;
      background: #190c07;
      border: 1px dashed var(--border-wood);
      border-radius: 10px;
    }

    .pool-items.drag-over {
      background-color: rgba(229, 169, 59, 0.15);
      border-color: var(--gold-accent);
    }

    /* Movie Cards */
    .movie-card {
      width: 96px;
      height: 144px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-wood-card);
      border: 2px solid #5a3825;
      display: flex;
      flex-direction: column;
      cursor: grab;
      position: relative;
      transition: transform 0.18s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .movie-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--gold-accent);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7), 0 0 12px var(--gold-glow);
      z-index: 5;
    }

    .movie-card:active {
      cursor: grabbing;
    }

    .movie-card.selected {
      border: 3px solid #ffde59;
      box-shadow: 0 0 0 4px rgba(255, 222, 89, 0.4), 0 8px 20px rgba(0, 0, 0, 0.8);
      transform: translateY(-4px) scale(1.04);
      z-index: 10;
    }

    .movie-card.is-dragging {
      opacity: 0.45;
      transform: scale(0.95);
    }

    .card-art {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .card-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-title {
      height: 38px;
      min-height: 38px;
      background: linear-gradient(180deg, #26150e, #180c07);
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      word-break: keep-all;
    }

    /* Delete Button on Card */
    .card-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(18, 9, 5, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ff9e9e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      z-index: 6;
    }

    .movie-card:hover .card-delete-btn,
    .movie-card.selected .card-delete-btn {
      opacity: 1;
    }

    .card-delete-btn:hover {
      background: #c92a2a;
      color: #ffffff;
    }

    /* Custom added movie tag */
    .custom-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 9px;
      font-weight: 700;
      background: rgba(36, 82, 58, 0.85);
      color: #9fe3be;
      border: 1px solid #357352;
      padding: 1px 4px;
      border-radius: 4px;
      z-index: 6;
    }

    /* Mobile Quick-Move Bar (Sticky Bottom) */
    .mobile-move-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(23, 11, 7, 0.95);
      border-top: 2px solid var(--gold-accent);
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
    }

    .mobile-move-bar.show {
      display: flex;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .bar-info {
      font-size: 0.9rem;
      color: var(--amber-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bar-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-tier-move {
      flex: 1;
      height: 44px;
      border-radius: 8px;
      border: none;
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    .btn-tier-move.move-s { background: #b83232; }
    .btn-tier-move.move-a { background: #c96827; }
    .btn-tier-move.move-b { background: #bfa134; }
    .btn-tier-move.move-c { background: #3d7355; }
    .btn-tier-move.move-pool { background: #45291d; font-size: 0.85rem; }

    /* Modal / Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #2b1710;
      border: 2px solid var(--border-wood);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 24px var(--gold-glow);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      color: var(--text-main);
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--amber-light);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-body {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .text-input {
      width: 100%;
      padding: 12px 14px;
      background: #180c07;
      border: 1px solid var(--border-wood);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .text-input:focus {
      border-color: var(--gold-accent);
      box-shadow: 0 0 8px var(--gold-glow);
    }

    .color-select-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .color-chip {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-chip.active {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* TV & Large screen readability */
    @media (min-width: 900px) {
      h1 { font-size: 2.8rem; }
      .tier-label { width: 120px; min-width: 120px; font-size: 3rem; }
      .movie-card { width: 108px; height: 160px; }
      .card-title { font-size: 0.85rem; height: 42px; min-height: 42px; }
    }

    /* Mobile specific adjustments */
    @media (max-width: 600px) {
      body { padding: 16px 10px 90px; }
      h1 { font-size: 1.8rem; }
      .subtitle { font-size: 0.9rem; }
      .tier-label { width: 70px; min-width: 70px; font-size: 1.9rem; }
      .tier-row { min-height: 110px; }
      .tier-items { min-height: 110px; padding: 8px; gap: 8px; }
      .movie-card { width: 78px; height: 120px; }
      .card-title { font-size: 0.68rem; height: 32px; min-height: 32px; padding: 2px 4px; }
      .card-delete-btn { width: 24px; height: 24px; opacity: 0.9; }
      .toolbar { padding: 10px; }
      .btn { padding: 8px 12px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-tag">Cozy Movie Night Tier List</div>
      <h1>벽난로 영화 티어리스트</h1>
      <p class="subtitle">크리스마스 벽난로 앞에서 친구들과 나누는 우리만의 명작 영화 랭킹</p>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="tool-group">
        <button class="btn btn-green" id="btn-add-movie" onclick="openAddMovieModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          영화 추가하기
        </button>
        <button class="btn btn-wood" id="btn-reset" onclick="confirmReset()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          처음부터 다시
        </button>
      </div>
      <div class="tool-group">
        <button class="btn btn-wine" id="btn-save-img" onclick="saveAsImage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          이미지로 저장 (PNG)
        </button>
      </div>
    </div>

    <!-- Tier Board Section -->
    <div id="tier-board-wrapper">
      <div class="tier-board-header">
        <span>MOVIENIGHT TIER LIST</span>
        <span style="font-size: 0.8rem; opacity: 0.8;">S · A · B · C</span>
      </div>

      <!-- S Tier -->
      <div class="tier-row tier-s" data-tier="S">
        <div class="tier-label">S</div>
        <div class="tier-items" id="tier-S" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, 'S')"></div>
      </div>

      <!-- A Tier -->
      <div class="tier-row tier-a" data-tier="A">
        <div class="tier-label">A</div>
        <div class="tier-items" id="tier-A" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, 'A')"></div>
      </div>

      <!-- B Tier -->
      <div class="tier-row tier-b" data-tier="B">
        <div class="tier-label">B</div>
        <div class="tier-items" id="tier-B" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, 'B')"></div>
      </div>

      <!-- C Tier -->
      <div class="tier-row tier-c" data-tier="C">
        <div class="tier-label">C</div>
        <div class="tier-items" id="tier-C" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, 'C')"></div>
      </div>
    </div>

    <!-- Unranked Pool Section -->
    <div class="pool-section">
      <div class="pool-header">
        <div class="pool-title">
          <span>대기 중인 영화 목록</span>
          <span class="pool-badge" id="pool-count">0편</span>
        </div>
        <span style="font-size: 0.85rem; color: var(--text-muted);">
          PC: 카드를 드래그하여 등급에 놓기 / 모바일: 카드를 터치한 후 등급 버튼 선택
        </span>
      </div>
      <div class="pool-items" id="tier-POOL" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, 'POOL')"></div>
    </div>
  </div>

  <!-- Mobile Quick Action Floating Bar -->
  <div class="mobile-move-bar" id="mobile-bar">
    <div class="bar-info">
      <span>선택됨: <strong id="selected-movie-title" style="color: #fff;">-</strong></span>
      <button onclick="clearSelection()" style="background:transparent; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer;">취소 ✕</button>
    </div>
    <div class="bar-buttons">
      <button class="btn-tier-move move-s" onclick="moveSelectedCardTo('S')">S</button>
      <button class="btn-tier-move move-a" onclick="moveSelectedCardTo('A')">A</button>
      <button class="btn-tier-move move-b" onclick="moveSelectedCardTo('B')">B</button>
      <button class="btn-tier-move move-c" onclick="moveSelectedCardTo('C')">C</button>
      <button class="btn-tier-move move-pool" onclick="moveSelectedCardTo('POOL')">대기함</button>
    </div>
  </div>

  <!-- Add Movie Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-box">
      <div class="modal-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        영화 추가
      </div>
      <div class="input-group">
        <label class="input-label" for="new-movie-title">영화 제목</label>
        <input type="text" id="new-movie-title" class="text-input" placeholder="예: 어바웃 타임, 해리 포터..." maxlength="30" onkeydown="if(event.key==='Enter') saveNewMovie()">
      </div>
      <div class="input-group">
        <label class="input-label">카드 배경 색상</label>
        <div class="color-select-row" id="color-options">
          <div class="color-chip active" style="background: #721b24;" data-color="#721b24" onclick="selectColor(this)"></div>
          <div class="color-chip" style="background: #1c3b2b;" data-color="#1c3b2b" onclick="selectColor(this)"></div>
          <div class="color-chip" style="background: #203554;" data-color="#203554" onclick="selectColor(this)"></div>
          <div class="color-chip" style="background: #4a2754;" data-color="#4a2754" onclick="selectColor(this)"></div>

    /* --- 상태 관리 --- */
    const STORAGE_KEY = "cozy_movie_tierlist_v1";

    let state = {
      movies: {}, // id -> movie object
      tiers: {
        S: [],
        A: [],
        B: [],
        C: [],
        POOL: []
      }
    };

    let selectedMovieId = null;
    let selectedColor = "#721b24";
    let pendingConfirmAction = null;

    /* --- 초기화 및 로컬 스토리지 연동 --- */
    function initState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.movies && parsed.tiers) {
            state = parsed;
            renderAll();
            return;
          }
        } catch (e) {
          console.warn("저장된 데이터 불러오기 실패:", e);
        }
      }
      resetToDefault();
    }

    function resetToDefault() {
      state.movies = {};
      state.tiers = { S: [], A: [], B: [], C: [], POOL: [] };

      DEFAULT_MOVIES.forEach(m => {
        state.movies[m.id] = { ...m };
        state.tiers.POOL.push(m.id);
      });

      saveState();
      renderAll();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("로컬 스토리지 저장 오류:", e);
      }
      updatePoolCount();
    }

    /* --- 렌더링 함수 --- */
    function renderAll() {
      ['S', 'A', 'B', 'C', 'POOL'].forEach(tierKey => {
        const container = document.getElementById(tierKey === 'POOL' ? 'tier-POOL' : `tier-${tierKey}`);
        if (!container) return;
        container.innerHTML = "";

        const ids = state.tiers[tierKey] || [];
        ids.forEach(id => {
          const movie = state.movies[id];
          if (!movie) return;
          const card = createCardElement(movie, tierKey);
          container.appendChild(card);
        });
      });
      updatePoolCount();
    }

    function createCardElement(movie, currentTier) {
      const card = document.createElement('div');
      card.className = `movie-card ${selectedMovieId === movie.id ? 'selected' : ''}`;
      card.id = `card-${movie.id}`;
      card.setAttribute('draggable', 'true');
      card.dataset.movieId = movie.id;
      card.dataset.currentTier = currentTier;

      // Card Artwork
      let artContent = "";
      if (movie.svg) {
        artContent = movie.svg;
      } else {
        // Custom added movie artwork (Warm minimalist ticket/clapperboard style)
        artContent = `
          <div style="width:100%; height:100%; background: ${movie.themeColor || '#44271c'}; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; padding:6px;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
              <line x1="7" y1="2" x2="7" y2="22"></line>
              <line x1="17" y1="2" x2="17" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <line x1="2" y1="7" x2="7" y2="7"></line>
              <line x1="2" y1="17" x2="7" y2="17"></line>
              <line x1="17" y1="17" x2="22" y2="17"></line>
              <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
          </div>
        `;
      }

      card.innerHTML = `
        ${movie.isCustom ? '<span class="custom-badge">직접 추가</span>' : ''}
        <button class="card-delete-btn" title="영화 삭제" onclick="confirmDeleteMovie(event, '${movie.id}')">✕</button>
        <div class="card-art">${artContent}</div>
        <div class="card-title">${escapeHtml(movie.title)}</div>
      `;

      // PC Drag & Drop Listeners
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);

      // Mobile & Touch/Click Selection
      card.addEventListener('click', (e) => {
        if (e.target.closest('.card-delete-btn')) return;
        toggleSelectCard(movie.id);
      });

      return card;
    }

    function updatePoolCount() {
      const poolCountEl = document.getElementById('pool-count');
      if (poolCountEl) {
        const count = state.tiers.POOL ? state.tiers.POOL.length : 0;
        poolCountEl.textContent = `${count}편`;
      }
    }

    /* --- PC 드래그 앤 드롭 구현 --- */
    let draggedMovieId = null;

    function onDragStart(e) {
      draggedMovieId = this.dataset.movieId;
      e.dataTransfer.setData('text/plain', draggedMovieId);
      e.dataTransfer.effectAllowed = 'move';
      this.classList.add('is-dragging');
    }

    function onDragEnd() {
      this.classList.remove('is-dragging');
      document.querySelectorAll('.tier-items, .pool-items').forEach(el => el.classList.remove('drag-over'));
      draggedMovieId = null;
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e, targetTier) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || draggedMovieId;
      if (!id || !state.movies[id]) return;

      moveMovieToTier(id, targetTier);
    }

    /* --- 상태 변경 및 영화 이동 --- */
    function moveMovieToTier(movieId, targetTier) {
      // Find and remove from current tier
      ['S', 'A', 'B', 'C', 'POOL'].forEach(t => {
        state.tiers[t] = (state.tiers[t] || []).filter(id => id !== movieId);
      });

      // Add to target tier
      if (!state.tiers[targetTier]) state.tiers[targetTier] = [];
      state.tiers[targetTier].push(movieId);

      saveState();
      renderAll();

      if (selectedMovieId === movieId) {
        clearSelection();
      }
    }

    /* --- 모바일 터치 / 선택 방식 동작 --- */
    function toggleSelectCard(movieId) {
      if (selectedMovieId === movieId) {
        clearSelection();
        return;
      }
      selectedMovieId = movieId;
      const movie = state.movies[movieId];

      // Highlight selected card
      document.querySelectorAll('.movie-card').forEach(c => c.classList.remove('selected'));
      const activeCard = document.getElementById(`card-${movieId}`);
      if (activeCard) activeCard.classList.add('selected');

      // Show bottom bar
      const bar = document.getElementById('mobile-bar');
      const titleSpan = document.getElementById('selected-movie-title');
      if (movie && bar && titleSpan) {
        titleSpan.textContent = movie.title;
        bar.classList.add('show');
      }
    }

    function clearSelection() {
      selectedMovieId = null;
      document.querySelectorAll('.movie-card').forEach(c => c.classList.remove('selected'));
      const bar = document.getElementById('mobile-bar');
      if (bar) bar.classList.remove('show');
    }

    function moveSelectedCardTo(targetTier) {
      if (!selectedMovieId) return;
      moveMovieToTier(selectedMovieId, targetTier);
      clearSelection();
    }

    /* --- 영화 추가 모달 및 동작 --- */
    function openAddMovieModal() {
      document.getElementById('new-movie-title').value = "";
      document.getElementById('add-modal').classList.add('open');
      setTimeout(() => document.getElementById('new-movie-title').focus(), 100);
    }

    function closeAddMovieModal() {
      document.getElementById('add-modal').classList.remove('open');
    }

    function selectColor(chip) {
      document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedColor = chip.dataset.color;
    }

    function saveNewMovie() {
      const input = document.getElementById('new-movie-title');
      const title = input.value.trim();
      if (!title) {
        alert("영화 제목을 입력해 주세요.");
        input.focus();
        return;
      }

      // Check duplicates
      const exists = Object.values(state.movies).some(m => m.title.toLowerCase() === title.toLowerCase());
      if (exists) {
        if (!confirm(`'${title}' 영화가 이미 목록에 있습니다. 그래도 추가할까요?`)) {
          return;
        }
      }

      const id = "custom_" + Date.now();
      const newMovie = {
        id: id,
        title: title,
        isCustom: true,
        themeColor: selectedColor,
        svg: null
      };

      state.movies[id] = newMovie;
      state.tiers.POOL.push(id);

      saveState();
      renderAll();
      closeAddMovieModal();
    }

    /* --- 영화 삭제 / 초기화 확인 모달 --- */
    function confirmDeleteMovie(event, movieId) {
      event.stopPropagation();
      const movie = state.movies[movieId];
      if (!movie) return;

      openConfirmModal(
        "영화 제외",
        `'${movie.title}'을(를) 목록에서 제외하시겠습니까?`,
        () => {
          deleteMovie(movieId);
        }
      );
    }

    function deleteMovie(movieId) {
      ['S', 'A', 'B', 'C', 'POOL'].forEach(t => {
        state.tiers[t] = (state.tiers[t] || []).filter(id => id !== movieId);
      });
      delete state.movies[movieId];

      if (selectedMovieId === movieId) {
        clearSelection();
      }

      saveState();
      renderAll();
    }

    function confirmReset() {
      openConfirmModal(
        "처음부터 다시 시작",
        "모든 배치를 초기화하고 기본 영화 8편으로 되돌리시겠습니까? 직접 추가한 영화는 정리됩니다.",
        () => {
          resetToDefault();
          clearSelection();
        }
      );
    }

    function openConfirmModal(title, message, callback) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      pendingConfirmAction = callback;
      document.getElementById('confirm-modal').classList.add('open');
    }

    function closeConfirmModal(isConfirmed) {
      document.getElementById('confirm-modal').classList.remove('open');
      if (isConfirmed && typeof pendingConfirmAction === 'function') {
        pendingConfirmAction();
      }
      pendingConfirmAction = null;
    }

    /* --- HTML5 Canvas 기반 자체 고해상도 PNG 이미지 다운로드 (외부 라이브러리/CDN 불필요) --- */
    function saveAsImage() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const width = 1200;
      
      const tiers = [
        { label: 'S', color: '#b83232', items: state.tiers.S || [] },
        { label: 'A', color: '#c96827', items: state.tiers.A || [] },
        { label: 'B', color: '#bfa134', items: state.tiers.B || [] },
        { label: 'C', color: '#3d7355', items: state.tiers.C || [] }
      ];

      // Calculate dynamic height based on item rows
      const cardW = 100;
      const cardH = 145;
      const cardGap = 12;
      const labelW = 120;
      const contentW = width - labelW - 60;
      const itemsPerRow = Math.max(1, Math.floor(contentW / (cardW + cardGap)));

      const tierHeights = tiers.map(t => {
        const rows = Math.max(1, Math.ceil(t.items.length / itemsPerRow));
        return Math.max(140, rows * (cardH + cardGap) + cardGap);
      });

      const headerH = 140;
      const footerH = 40;
      const totalH = headerH + tierHeights.reduce((a, b) => a + b, 0) + footerH;

      canvas.width = width;
      canvas.height = totalH;

      // 1. Cozy Fireplace Wood Background
      const bgGrad = ctx.createRadialGradient(width/2, 100, 50, width/2, totalH/2, totalH);
      bgGrad.addColorStop(0, '#2c1810');
      bgGrad.addColorStop(0.7, '#180c08');
      bgGrad.addColorStop(1, '#0e0604');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, totalH);

      // 2. Title & Ambient Header
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e5a93b';
      ctx.font = '600 16px sans-serif';
      ctx.fillText('COZY MOVIE NIGHT TIER LIST', width / 2, 45);

      ctx.fillStyle = '#fff4e6';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('벽난로 영화 티어리스트', width / 2, 90);

      ctx.strokeStyle = '#5a3825';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, headerH - 15);
      ctx.lineTo(width - 40, headerH - 15);
      ctx.stroke();

      // 3. Draw Each Tier Row
      let currentY = headerH;

      tiers.forEach((tier, idx) => {
        const rowH = tierHeights[idx];
        const rowY = currentY;

        // Row background
        ctx.fillStyle = '#20110b';
        ctx.fillRect(40, rowY, width - 80, rowH);
        ctx.strokeStyle = '#5a3825';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(40, rowY, width - 80, rowH);

        // Tier Label Box
        ctx.fillStyle = tier.color;
        ctx.fillRect(40, rowY, labelW, rowH);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 50px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tier.label, 40 + labelW / 2, rowY + rowH / 2);

        // Movie Cards inside Tier
        tier.items.forEach((mId, itemIdx) => {
          const movie = state.movies[mId];
          if (!movie) return;

          const col = itemIdx % itemsPerRow;
          const row = Math.floor(itemIdx / itemsPerRow);
          const cx = 40 + labelW + cardGap + col * (cardW + cardGap);
          const cy = rowY + cardGap + row * (cardH + cardGap);

          // Card Background
          ctx.fillStyle = movie.themeColor || '#3a2218';
          roundRect(ctx, cx, cy, cardW, cardH, 6, true, false);

          // Card Border
          ctx.strokeStyle = '#5a3825';
          ctx.lineWidth = 2;
          roundRect(ctx, cx, cy, cardW, cardH, 6, false, true);

          // Clapper/Ticket icon in center
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.beginPath();
          ctx.arc(cx + cardW/2, cy + 50, 22, 0, Math.PI * 2);
          ctx.fill();

          // Card Title text
          ctx.fillStyle = '#140c08';
          ctx.fillRect(cx, cy + cardH - 36, cardW, 36);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Word wrap title
          const title = movie.title;
          if (title.length > 7) {
            ctx.fillText(title.substring(0, 7), cx + cardW / 2, cy + cardH - 24);
            ctx.fillText(title.substring(7, 14), cx + cardW / 2, cy + cardH - 10);
          } else {
            ctx.fillText(title, cx + cardW / 2, cy + cardH - 18);
          }
        });

        currentY += rowH;
      });

      // Watermark / Date footer
      ctx.textAlign = 'right';
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#8f7362';
      const nowStr = new Date().toLocaleDateString('ko-KR');
      ctx.fillText(`${nowStr} · Cozy Movie Night Tier List`, width - 45, totalH - 15);

      // Trigger download
      const link = document.createElement('a');
      link.download = `벽난로_영화_티어리스트_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', initState);
  </script>
</body>
