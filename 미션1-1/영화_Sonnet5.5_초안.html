<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 티어리스트</title>
<style>
  :root {
    --wood-900: #1f110b;
    --wood-800: #2b1810;
    --wood-700: #3a2218;
    --cream: #f4e3c1;
    --cream-dim: #d9c7a3;
    --amber: #f2a43a;
    --ember: #d9582b;
    --wine: #7a1f2b;
    --fir: #2f5d46;
    --card-w: clamp(92px, 11vw, 180px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--cream);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", sans-serif;
    background:
      radial-gradient(ellipse at 50% 115%, rgba(242, 164, 58, 0.38), transparent 58%),
      linear-gradient(var(--wood-900), var(--wood-800) 55%, #3a1c12);
    background-attachment: fixed;
    padding-bottom: 110px;
    overflow-x: hidden;
  }

  /* 장식: 전구 줄, 눈 */
  .lights {
    height: 26px;
    background:
      radial-gradient(circle at 15px 13px, #f2a43a 0 4px, transparent 5px),
      radial-gradient(circle at 45px 13px, #d9582b 0 4px, transparent 5px),
      radial-gradient(circle at 75px 13px, #d6b04b 0 4px, transparent 5px),
      radial-gradient(circle at 105px 13px, #5fa070 0 4px, transparent 5px);
    background-size: 120px 26px;
    background-repeat: repeat-x;
    filter: drop-shadow(0 0 5px rgba(242, 164, 58, 0.7));
    opacity: 0.9;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .snow span {
    position: absolute; top: -12px; border-radius: 50%;
    background: rgba(255, 244, 224, 0.75);
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translate3d(var(--drift, 20px), 105vh, 0); }
  }
  @media (prefers-reduced-motion: reduce) { .snow { display: none; } }

  .wrap { position: relative; z-index: 1; max-width: 1500px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 32px); }

  header { padding: 18px 0 10px; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 4.2vw, 56px);
    letter-spacing: -0.02em;
    color: #fff1dc;
    text-shadow: 0 0 18px rgba(242, 164, 58, 0.45);
  }
  .sub { margin: 6px 0 0; color: var(--cream-dim); font-size: clamp(14px, 1.6vw, 20px); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 18px; }
  .add-form { display: flex; gap: 8px; flex: 1 1 280px; max-width: 520px; }
  .add-form input {
    flex: 1; min-width: 0;
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(244, 227, 193, 0.28);
    background: rgba(0, 0, 0, 0.3); color: var(--cream);
    font: inherit; font-size: 16px;
  }
  .add-form input::placeholder { color: rgba(244, 227, 193, 0.5); }
  .add-form input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }

  button { font: inherit; cursor: pointer; }
  .btn {
    padding: 11px 16px; border-radius: 10px; border: 1px solid rgba(244, 227, 193, 0.3);
    background: rgba(244, 227, 193, 0.1); color: var(--cream); font-weight: 600; font-size: 15px;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(244, 227, 193, 0.2); }
  .btn.primary { background: var(--amber); color: #2b1810; border-color: var(--amber); }
  .btn.primary:hover { background: #ffb852; }
  .btn.danger { border-color: rgba(217, 88, 43, 0.6); color: #ffc7ae; }
  .btn:focus-visible, .card:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .spacer { flex: 1 1 0; }

  .hint { color: var(--cream-dim); font-size: clamp(13px, 1.4vw, 17px); margin: 0 0 14px; }
  .notice {
    display: none; margin: 0 0 14px; padding: 10px 14px; border-radius: 10px;
    background: rgba(217, 88, 43, 0.18); border: 1px solid rgba(217, 88, 43, 0.5); font-size: 14px;
  }
  .notice.show { display: block; }

  /* 등급 줄 */
  .tier {
    display: grid; grid-template-columns: clamp(60px, 8vw, 120px) 1fr;
    margin-bottom: 12px; border-radius: 16px; overflow: hidden;
    background: rgba(244, 227, 193, 0.07);
    border: 1px solid rgba(244, 227, 193, 0.12);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  }
  .tier-label {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(34px, 5vw, 72px); font-weight: 800;
  }
  .zone {
    display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start;
    padding: 12px; min-height: calc(var(--card-w) * 1.5 + 70px);
    transition: background 0.15s;
  }
  .zone:empty::before {
    content: attr(data-empty); color: rgba(244, 227, 193, 0.4); font-size: 14px; align-self: center;
  }
  .zone.over { background: rgba(242, 164, 58, 0.16); outline: 2px dashed var(--amber); outline-offset: -6px; }

  .tray { margin-top: 22px; }
  .tray h2 { margin: 0 0 8px; font-size: clamp(18px, 2vw, 26px); }
  .tray .zone {
    border-radius: 16px; border: 1px dashed rgba(244, 227, 193, 0.35);
    background: rgba(0, 0, 0, 0.22);
  }

  /* 영화 카드 */
  .card {
    width: var(--card-w); cursor: grab; user-select: none; -webkit-user-select: none;
    transition: transform 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .poster {
    position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); background: var(--wood-700);
  }
  .poster img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .poster.custom { display: flex; align-items: center; justify-content: center; }
  .poster.custom span {
    font-size: clamp(44px, 6vw, 88px); font-weight: 800; color: rgba(255, 241, 220, 0.5);
  }
  .card .title {
    margin-top: 6px; text-align: center; font-weight: 700; line-height: 1.25;
    font-size: clamp(12px, 1.15vw, 19px); color: #fff1dc;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: keep-all;
  }
  .card.selected { transform: translateY(-4px); }
  .card.selected .poster { outline: 3px solid var(--amber); box-shadow: 0 0 0 5px rgba(242, 164, 58, 0.3), 0 8px 18px rgba(0, 0, 0, 0.6); }

  /* 하단 선택 바 */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px clamp(12px, 3vw, 32px) calc(12px + env(safe-area-inset-bottom));
    background: rgba(31, 17, 11, 0.96); border-top: 1px solid rgba(242, 164, 58, 0.5);
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
    transform: translateY(110%); visibility: hidden; transition: transform 0.2s, visibility 0.2s;
  }
  .bar.show { transform: none; visibility: visible; }
  .bar-inner { max-width: 1500px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar-name { flex: 1 1 100%; font-weight: 700; margin-bottom: 2px; font-size: 15px; }
  .bar-name b { color: var(--amber); }
  .tier-btn { min-width: 52px; padding: 11px 0; border-radius: 10px; border: 2px solid transparent; font-weight: 800; font-size: 18px; }
  .tier-btn.current { border-color: #fff1dc; }
  .bar .btn { padding: 11px 14px; }

  /* 확인 창, 알림 */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.65); padding: 20px;
  }
  .overlay.show { display: flex; }
  .dialog {
    width: min(420px, 100%); padding: 22px; border-radius: 16px;
    background: var(--wood-800); border: 1px solid rgba(242, 164, 58, 0.5);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  }
  .dialog p { margin: 0 0 18px; line-height: 1.55; font-size: 16px; }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; z-index: 60; transform: translate(-50%, 20px);
    max-width: min(90vw, 440px); padding: 11px 18px; border-radius: 999px;
    background: #fff1dc; color: #2b1810; font-weight: 700; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    .toolbar .spacer { display: none; }
    .btn { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="lights" aria-hidden="true"></div>
<div class="snow" id="snow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>영화 티어리스트</h1>
    <p class="sub">벽난로 앞에 둘러앉아, 내가 본 영화를 등급별로 나눠 봐요.</p>
  </header>

  <div class="toolbar">
    <form class="add-form" id="addForm" autocomplete="off">
      <input id="addInput" type="text" maxlength="30" placeholder="추가할 영화 제목" aria-label="추가할 영화 제목">
      <button class="btn primary" type="submit">영화 추가</button>
    </form>
    <div class="spacer"></div>
    <button class="btn" id="saveImg" type="button">이미지로 저장</button>
    <button class="btn danger" id="resetBtn" type="button">처음부터 다시</button>
  </div>

  <p class="hint">PC에서는 영화 카드를 끌어서 등급 줄에 놓고, 휴대폰에서는 카드를 눌러 선택한 뒤 아래에 나타나는 등급 버튼을 눌러요.</p>
  <p class="notice" id="notice">이 브라우저에서는 자동 저장을 쓸 수 없어요. 페이지를 닫으면 배치가 사라지니, 필요하면 이미지로 저장해 두세요.</p>

  <main id="board"></main>
</div>

<div class="bar" id="bar" role="region" aria-label="선택한 영화 옮기기">
  <div class="bar-inner">
    <div class="bar-name">선택한 영화: <b id="barName"></b></div>
    <button class="tier-btn" type="button" data-tier="S">S</button>
    <button class="tier-btn" type="button" data-tier="A">A</button>
    <button class="tier-btn" type="button" data-tier="B">B</button>
    <button class="tier-btn" type="button" data-tier="C">C</button>
    <button class="btn" type="button" data-tier="">보관함으로</button>
    <button class="btn danger" type="button" id="removeBtn">영화 빼기</button>
    <button class="btn" type="button" id="cancelSel">선택 해제</button>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="dialog">
    <p id="dlgMsg"></p>
    <div class="row">
      <button class="btn" type="button" id="dlgCancel">취소</button>
      <button class="btn primary" type="button" id="dlgOk">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif';
  var TIERS = ['S', 'A', 'B', 'C'];
  var TIER_COLORS = {
    S: { bg: '#b3303a', fg: '#fff1dc' },
    A: { bg: '#e0792b', fg: '#2b1810' },
    B: { bg: '#d6b04b', fg: '#2b1810' },
    C: { bg: '#3f7a55', fg: '#fff1dc' }
  };
  var STORE_KEY = 'movie-tierlist-v1';
  var DEFAULT_TITLES = [
    '기생충', '인터스텔라', '라라랜드', '센과 치히로의 행방불명',
    '어벤져스: 엔드게임', '범죄도시', '타이타닉', '토이 스토리'
  ];
  var CUSTOM_PALETTE = [
    ['#7a1f2b', '#3a1218'], ['#2f5d46', '#16301f'], ['#a8561f', '#5a2a10'],
    ['#5b3a29', '#2a170f'], ['#8a6a1f', '#3d2d0a'], ['#6b2d4a', '#2f1220']
  ];

  /* ---------- 대체 포스터 (직접 그린 원본 SVG, 실제 포스터·캐릭터 아님) ---------- */
  function svgWrap(defs, inner) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">' +
      (defs ? '<defs>' + defs + '</defs>' : '') + inner + '</svg>';
  }
  function vGrad(id, stops) {
    var s = '';
    for (var i = 0; i < stops.length; i++) {
      s += '<stop offset="' + stops[i][0] + '" stop-color="' + stops[i][1] + '"/>';
    }
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' + s + '</linearGradient>';
  }
  function rain(n, color, op) {
    var s = '';
    for (var i = 0; i < n; i++) {
      var x = (i * 37) % 220 - 10, y = (i * 53) % 300;
      s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 8) + '" y2="' + (y + 22) + '"/>';
    }
    return '<g stroke="' + color + '" stroke-width="1.2" opacity="' + op + '">' + s + '</g>';
  }
  function stars(n, color, maxY) {
    var s = '';
    for (var i = 0; i < n; i++) {
      var cx = (i * 61) % 192 + 4, cy = (i * 43) % maxY + 4, r = (i % 3) * 0.5 + 0.7;
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
    }
    return '<g fill="' + color + '">' + s + '</g>';
  }
  function skyline() {
    var s = '', x = 0, i = 0, hs = [110, 150, 90, 170, 120, 140, 100, 160];
    while (x < 200) {
      var w = 22 + (i * 7) % 14, h = hs[i % hs.length];
      s += '<rect x="' + x + '" y="' + (300 - h) + '" width="' + w + '" height="' + h + '" fill="#1a0b0b"/>';
      for (var wy = 300 - h + 10; wy < 290; wy += 16) {
        for (var wx = x + 5; wx < x + w - 6; wx += 9) {
          if ((wx * 7 + wy * 3 + i) % 5 < 2) {
            s += '<rect x="' + wx + '" y="' + wy + '" width="4" height="6" fill="#f2a43a" opacity="0.85"/>';
          }
        }
      }
      x += w + 2; i++;
    }
    return s;
  }
  function rays() {
    var s = '';
    for (var i = 0; i < 14; i++) {
      s += '<rect x="99" y="-40" width="2.4" height="190" transform="rotate(' + (i * 360 / 14) + ' 100 150)"/>';
    }
    return '<g fill="#f2a43a" opacity="0.55">' + s + '</g>';
  }

  var POSTER_SVG = {
    // 기생충: 계단처럼 내려가는 집들과 빗줄기
    d1: svgWrap(vGrad('g', [[0, '#8a2a30'], [1, '#2b1810']]),
      '<rect width="200" height="300" fill="url(#g)"/>' + rain(40, '#f4e3c1', 0.18) +
      '<path d="M0 130 H44 V160 H88 V190 H132 V220 H176 V250 H200 V300 H0 Z" fill="#1c0f0a" stroke="#f2a43a" stroke-width="2"/>' +
      '<g fill="#f2a43a"><rect x="10" y="142" width="16" height="12"/><rect x="54" y="172" width="16" height="12"/>' +
      '<rect x="98" y="202" width="16" height="12"/><rect x="142" y="232" width="16" height="12"/></g>'),
    // 인터스텔라: 고리를 두른 행성과 별
    d2: svgWrap('<radialGradient id="g" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#4a2a1c"/><stop offset="1" stop-color="#120a07"/></radialGradient>' +
      '<radialGradient id="p" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#f6c06a"/><stop offset="1" stop-color="#a8561f"/></radialGradient>',
      '<rect width="200" height="300" fill="url(#g)"/>' + stars(30, '#f4e3c1', 190) +
      '<g transform="rotate(-18 100 140)"><path d="M10 140 A90 22 0 0 1 190 140" fill="none" stroke="#f4e3c1" stroke-width="3" opacity="0.8"/>' +
      '<circle cx="100" cy="140" r="42" fill="url(#p)"/>' +
      '<path d="M10 140 A90 22 0 0 0 190 140" fill="none" stroke="#f4e3c1" stroke-width="3"/></g>'),
    // 라라랜드: 해 질 녘 하늘, 반짝이는 별, 언덕 아래 도시 불빛
    d3: svgWrap(vGrad('g', [[0, '#3d1a3a'], [0.55, '#b3303a'], [1, '#f2a43a']]),
      '<rect width="200" height="300" fill="url(#g)"/>' + stars(26, '#fff1dc', 130) +
      '<path d="M100 40 L104 56 L120 60 L104 64 L100 80 L96 64 L80 60 L96 56 Z" fill="#fff1dc"/>' +
      '<path d="M0 215 Q50 185 100 205 T200 195 V300 H0 Z" fill="#1c0f0a"/>' +
      '<g fill="#f2a43a">' + (function () {
        var s = '';
        for (var i = 0; i < 26; i++) {
          s += '<circle cx="' + ((i * 29) % 190 + 5) + '" cy="' + (230 + (i * 17) % 60) + '" r="1.8"/>';
        }
        return s;
      })() + '</g>'),
    // 센과 치히로: 달밤, 줄에 걸린 등불, 잔물결
    d4: svgWrap(vGrad('g', [[0, '#16301f'], [1, '#0b1610']]) +
      '<radialGradient id="m"><stop offset="0" stop-color="#fff1dc"/><stop offset="1" stop-color="#f4e3c1"/></radialGradient>',
      '<rect width="200" height="300" fill="url(#g)"/><circle cx="100" cy="82" r="56" fill="#f4e3c1" opacity="0.12"/>' +
      '<circle cx="100" cy="82" r="38" fill="url(#m)"/>' +
      '<path d="M0 168 Q100 188 200 168" fill="none" stroke="#f4e3c1" stroke-width="1.5" opacity="0.7"/>' +
      '<g>' + [28, 64, 100, 136, 172].map(function (x, i) {
        var y = 178 + Math.round(10 * Math.sin((x / 200) * Math.PI)) + 4;
        return '<rect x="' + (x - 5) + '" y="' + (y - 3) + '" width="10" height="5" fill="#2b1810"/>' +
          '<ellipse cx="' + x + '" cy="' + (y + 12) + '" rx="9" ry="12" fill="#d9582b"/>' +
          '<ellipse cx="' + x + '" cy="' + (y + 12) + '" rx="14" ry="17" fill="#f2a43a" opacity="0.22"/>';
      }).join('') + '</g>' +
      '<g fill="none" stroke="#5fa070" stroke-width="2" opacity="0.8">' +
      '<path d="M0 250 Q25 240 50 250 T100 250 T150 250 T200 250"/>' +
      '<path d="M0 270 Q25 260 50 270 T100 270 T150 270 T200 270"/>' +
      '<path d="M0 290 Q25 280 50 290 T100 290 T150 290 T200 290"/></g>'),
    // 어벤져스: 엔드게임: 중심에서 퍼져 나가는 빛줄기와 겹친 원
    d5: svgWrap('<radialGradient id="g" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#5a1f1a"/><stop offset="1" stop-color="#120807"/></radialGradient>',
      '<rect width="200" height="300" fill="url(#g)"/>' + rays() +
      '<circle cx="100" cy="150" r="58" fill="none" stroke="#f2a43a" stroke-width="3"/>' +
      '<circle cx="100" cy="150" r="34" fill="none" stroke="#f4e3c1" stroke-width="2"/>' +
      '<circle cx="100" cy="150" r="12" fill="#fff1dc"/>'),
    // 범죄도시: 비 내리는 밤의 도시 윤곽
    d6: svgWrap(vGrad('g', [[0, '#4a1620'], [1, '#150909']]),
      '<rect width="200" height="300" fill="url(#g)"/>' +
      '<rect x="0" y="150" width="200" height="60" fill="#d9582b" opacity="0.22"/>' +
      skyline() + rain(36, '#f4e3c1', 0.16)),
    // 타이타닉: 달밤 바다, 배의 윤곽, 빙산
    d7: svgWrap(vGrad('g', [[0, '#0f2a24'], [1, '#3a1f2a']]),
      '<rect width="200" height="300" fill="url(#g)"/>' + stars(18, '#f4e3c1', 110) +
      '<circle cx="150" cy="60" r="20" fill="#f4e3c1" opacity="0.9"/>' +
      '<polygon points="0,236 20,196 34,212 52,178 74,236" fill="#f4e3c1" opacity="0.75"/>' +
      '<g fill="#150c0a"><path d="M90 214 H180 L170 228 H100 Z"/><rect x="112" y="198" width="44" height="16"/>' +
      '<rect x="120" y="184" width="9" height="14"/><rect x="138" y="184" width="9" height="14"/></g>' +
      '<path d="M0 226 Q25 212 50 226 T100 226 T150 226 T200 226 V300 H0 Z" fill="#1d4a3a" opacity="0.95"/>' +
      '<path d="M0 252 Q25 238 50 252 T100 252 T150 252 T200 252 V300 H0 Z" fill="#163a2e"/>' +
      '<path d="M0 278 Q25 264 50 278 T100 278 T150 278 T200 278 V300 H0 Z" fill="#0f2a24"/>'),
    // 토이 스토리: 장난감 블록과 공, 별
    d8: svgWrap(vGrad('g', [[0, '#f4e3c1'], [1, '#f2a43a']]),
      '<rect width="200" height="300" fill="url(#g)"/><rect x="0" y="250" width="200" height="50" fill="#7a4a2a"/>' +
      '<rect x="40" y="180" width="70" height="70" rx="4" fill="#b3303a"/><circle cx="75" cy="215" r="18" fill="#f4e3c1"/>' +
      '<rect x="110" y="190" width="60" height="60" rx="4" fill="#2f5d46"/><polygon points="140,200 158,236 122,236" fill="#f4e3c1"/>' +
      '<rect x="58" y="126" width="54" height="54" rx="4" fill="#d6b04b"/><rect x="73" y="141" width="24" height="24" fill="none" stroke="#2b1810" stroke-width="4"/>' +
      '<circle cx="178" cy="238" r="12" fill="#e0792b"/>' +
      '<polygon points="150,54 154.7,65.8 167.4,66.5 157.5,74.5 160.8,86.9 150,80 139.2,86.9 142.5,74.5 132.6,66.5 145.3,65.8" fill="#b3303a"/>')
  };

  function posterURI(id) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(POSTER_SVG[id]);
  }
  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function customColors(title) { return CUSTOM_PALETTE[hashStr(title) % CUSTOM_PALETTE.length]; }
  function firstChar(title) { return Array.from(title)[0] || ''; }

  /* ---------- 상태와 저장 ---------- */
  var state = { movies: [] };
  var storageOk = true;
  var selectedId = null;
  var dragId = null;

  function defaultMovies() {
    return DEFAULT_TITLES.map(function (t, i) { return { id: 'd' + (i + 1), title: t, tier: null, custom: false }; });
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { storageOk = false; showNotice(); }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) { state = { movies: defaultMovies() }; return; }
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.movies)) throw new Error('bad');
      var seen = {};
      var list = [];
      data.movies.forEach(function (m) {
        if (!m || typeof m.id !== 'string' || typeof m.title !== 'string' || seen[m.id]) return;
        var isDefault = /^d[1-8]$/.test(m.id);
        if (!isDefault && !m.custom) return;
        seen[m.id] = true;
        list.push({
          id: m.id,
          title: isDefault ? DEFAULT_TITLES[Number(m.id.slice(1)) - 1] : m.title.slice(0, 30),
          tier: TIERS.indexOf(m.tier) >= 0 ? m.tier : null,
          custom: !isDefault
        });
      });
      state = { movies: list };
    } catch (e) {
      state = { movies: defaultMovies() };
      try { localStorage.getItem(STORE_KEY); } catch (e2) { storageOk = false; }
    }
  }
  function checkStorage() {
    try {
      localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
    } catch (e) { storageOk = false; }
    if (!storageOk) showNotice();
  }
  function showNotice() { document.getElementById('notice').classList.add('show'); }

  function findMovie(id) {
    for (var i = 0; i < state.movies.length; i++) if (state.movies[i].id === id) return state.movies[i];
    return null;
  }

  /* ---------- 화면 그리기 ---------- */
  var board = document.getElementById('board');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function createCard(m) {
    var card = el('div', 'card' + (m.id === selectedId ? ' selected' : ''));
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('draggable', 'true');
    card.setAttribute('aria-label', m.title + (m.tier ? ', ' + m.tier + ' 등급' : ', 아직 나누지 않음'));
    card.dataset.id = m.id;

    var poster;
    if (m.custom) {
      var c = customColors(m.title);
      poster = el('div', 'poster custom');
      poster.style.background = 'linear-gradient(160deg,' + c[0] + ',' + c[1] + ')';
      poster.appendChild(el('span', null, firstChar(m.title)));
    } else {
      poster = el('div', 'poster');
      var img = document.createElement('img');
      img.src = posterURI(m.id);
      img.alt = '';
      img.draggable = false;
      poster.appendChild(img);
    }
    card.appendChild(poster);
    var t = el('div', 'title', m.title);
    t.title = m.title;
    card.appendChild(t);

    card.addEventListener('click', function () { toggleSelect(m.id); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelect(m.id); }
    });
    card.addEventListener('dragstart', function (e) {
      dragId = m.id;
      card.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', m.id); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* 무시 */ }
    });
    card.addEventListener('dragend', function () {
      dragId = null;
      card.classList.remove('dragging');
      clearOver();
    });
    return card;
  }

  function clearOver() {
    var zs = document.querySelectorAll('.zone.over');
    for (var i = 0; i < zs.length; i++) zs[i].classList.remove('over');
  }

  function wireZone(zone, tier) {
    zone.addEventListener('dragover', function (e) {
      if (!dragId) return;
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch (err) { /* 무시 */ }
      zone.classList.add('over');
    });
    zone.addEventListener('dragleave', function (e) {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove('over');
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('over');
      var id = dragId;
      if (!id) { try { id = e.dataTransfer.getData('text/plain'); } catch (err) { id = null; } }
      if (!id) return;
      var targetCard = e.target.closest ? e.target.closest('.card') : null;
      var beforeId = (targetCard && targetCard.dataset.id !== id) ? targetCard.dataset.id : null;
      moveMovie(id, tier, beforeId);
    });
  }

  function render() {
    board.textContent = '';
    TIERS.forEach(function (t) {
      var row = el('section', 'tier');
      var label = el('div', 'tier-label', t);
      label.style.background = TIER_COLORS[t].bg;
      label.style.color = TIER_COLORS[t].fg;
      var zone = el('div', 'zone');
      zone.dataset.tier = t;
      zone.dataset.empty = '비어 있어요';
      state.movies.forEach(function (m) { if (m.tier === t) zone.appendChild(createCard(m)); });
      wireZone(zone, t);
      row.appendChild(label);
      row.appendChild(zone);
      board.appendChild(row);
    });

    var tray = el('section', 'tray');
    var n = state.movies.filter(function (m) { return !m.tier; }).length;
    tray.appendChild(el('h2', null, '아직 나누지 않은 영화 (' + n + ')'));
    var tz = el('div', 'zone');
    tz.dataset.tier = '';
    tz.dataset.empty = '모든 영화를 등급에 놓았어요. 위의 "영화 추가"로 더 넣을 수 있어요.';
    state.movies.forEach(function (m) { if (!m.tier) tz.appendChild(createCard(m)); });
    wireZone(tz, null);
    tray.appendChild(tz);
    board.appendChild(tray);

    updateBar();
  }

  /* ---------- 동작 ---------- */
  function moveMovie(id, tier, beforeId) {
    var idx = -1, i;
    for (i = 0; i < state.movies.length; i++) if (state.movies[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    var m = state.movies.splice(idx, 1)[0];
    m.tier = tier || null;
    var at = -1;
    if (beforeId) {
      for (i = 0; i < state.movies.length; i++) if (state.movies[i].id === beforeId) { at = i; break; }
    }
    if (at < 0) state.movies.push(m); else state.movies.splice(at, 0, m);
    if (selectedId === id) selectedId = null;
    save();
    render();
  }

  function toggleSelect(id) {
    selectedId = (selectedId === id) ? null : id;
    render();
  }

  var bar = document.getElementById('bar');
  function updateBar() {
    var m = selectedId ? findMovie(selectedId) : null;
    if (!m) { selectedId = null; bar.classList.remove('show'); return; }
    document.getElementById('barName').textContent = m.title;
    var btns = bar.querySelectorAll('[data-tier]');
    for (var i = 0; i < btns.length; i++) {
      var t = btns[i].getAttribute('data-tier');
      if (TIERS.indexOf(t) >= 0) {
        btns[i].style.background = TIER_COLORS[t].bg;
        btns[i].style.color = TIER_COLORS[t].fg;
        btns[i].classList.toggle('current', m.tier === t);
      }
    }
    bar.classList.add('show');
  }

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tier]');
    if (!b || !selectedId) return;
    var t = b.getAttribute('data-tier');
    moveMovie(selectedId, t === '' ? null : t, null);
  });
  document.getElementById('cancelSel').addEventListener('click', function () { selectedId = null; render(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.classList.contains('show') && selectedId) { selectedId = null; render(); }
  });

  document.getElementById('removeBtn').addEventListener('click', function () {
    var m = selectedId ? findMovie(selectedId) : null;
    if (!m) return;
    confirmDialog('‘' + m.title + '’을(를) 목록에서 뺄까요?', '빼기').then(function (ok) {
      if (!ok) return;
      state.movies = state.movies.filter(function (x) { return x.id !== m.id; });
      selectedId = null;
      save();
      render();
      toast('영화를 뺐어요.');
    });
  });

  document.getElementById('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('addInput');
    var title = input.value.replace(/\s+/g, ' ').trim();
    if (!title) { toast('영화 제목을 입력해 주세요.'); return; }
    var key = title.replace(/\s/g, '').toLowerCase();
    var dup = state.movies.some(function (m) { return m.title.replace(/\s/g, '').toLowerCase() === key; });
    if (dup) { toast('이미 목록에 있는 영화예요.'); return; }
    var id = 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
    state.movies.push({ id: id, title: title.slice(0, 30), tier: null, custom: true });
    input.value = '';
    selectedId = id;
    save();
    render();
    toast('영화를 추가했어요. 등급 버튼을 눌러 옮겨 보세요.');
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    confirmDialog('모든 배치를 지우고 처음 상태로 돌릴까요? 추가한 영화는 사라지고, 뺀 기본 영화는 다시 돌아와요.', '처음부터 다시').then(function (ok) {
      if (!ok) return;
      state = { movies: defaultMovies() };
      selectedId = null;
      save();
      render();
      toast('처음 상태로 돌렸어요.');
    });
  });

  /* ---------- 확인 창, 알림 ---------- */
  var overlay = document.getElementById('overlay');
  var dlgResolve = null;
  function confirmDialog(msg, okLabel) {
    document.getElementById('dlgMsg').textContent = msg;
    document.getElementById('dlgOk').textContent = okLabel || '확인';
    overlay.classList.add('show');
    document.getElementById('dlgCancel').focus();
    return new Promise(function (resolve) { dlgResolve = resolve; });
  }
  function closeDialog(result) {
    overlay.classList.remove('show');
    if (dlgResolve) { var r = dlgResolve; dlgResolve = null; r(result); }
  }
  document.getElementById('dlgOk').addEventListener('click', function () { closeDialog(true); });
  document.getElementById('dlgCancel').addEventListener('click', function () { closeDialog(false); });
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeDialog(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeDialog(false);
  });

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  /* ---------- 이미지로 저장 (캔버스로 직접 그림, 외부 라이브러리 없음) ---------- */
  function loadImg(src) {
    return new Promise(function (resolve, reject) {
      var i = new Image();
      i.onload = function () { resolve(i); };
      i.onerror = reject;
      i.src = src;
    });
  }
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function wrapLines(ctx, text, maxW, maxLines) {
    var chars = Array.from(text), lines = [], cur = '';
    for (var i = 0; i < chars.length; i++) {
      var test = cur + chars[i];
      if (ctx.measureText(test).width > maxW && cur) {
        lines.push(cur); cur = chars[i];
        if (lines.length === maxLines) break;
      } else { cur = test; }
    }
    if (lines.length < maxLines && cur) lines.push(cur);
    var used = lines.join('').length;
    if (used < chars.length) {
      var last = lines[lines.length - 1];
      while (last.length > 1 && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[lines.length - 1] = last + '…';
    }
    return lines;
  }

  function exportImage() {
    var placed = state.movies.filter(function (m) { return m.tier; });
    if (!placed.length) { toast('아직 등급에 놓은 영화가 없어요.'); return; }

    var W = 1600, pad = 28, labelW = 150, cardW = 150, cardH = 225, gap = 18, titleH = 58, inner = 20, rowGap = 14;
    var cellH = cardH + 10 + titleH;
    var avail = W - pad * 2 - labelW - inner * 2;
    var perRow = Math.max(1, Math.floor((avail + gap) / (cardW + gap)));

    var rows = TIERS.map(function (t) {
      var items = state.movies.filter(function (m) { return m.tier === t; });
      var r = Math.max(1, Math.ceil(items.length / perRow));
      var h = items.length ? inner * 2 + r * cellH + (r - 1) * gap : 110;
      return { t: t, items: items, h: h };
    });
    var H = pad * 2 + rows.reduce(function (s, r) { return s + r.h; }, 0) + (rows.length - 1) * rowGap;

    var jobs = placed.filter(function (m) { return !m.custom; }).map(function (m) {
      return loadImg(posterURI(m.id)).then(function (img) { return [m.id, img]; });
    });

    Promise.all(jobs).then(function (pairs) {
      var imgs = {};
      pairs.forEach(function (p) { imgs[p[0]] = p[1]; });

      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');

      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#2b1810'); bg.addColorStop(1, '#1f110b');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      var y = pad;
      rows.forEach(function (row) {
        var x0 = pad;
        // 줄 배경
        ctx.fillStyle = '#3a2218';
        rr(ctx, x0, y, W - pad * 2, row.h, 16); ctx.fill();
        // 등급 라벨
        ctx.save();
        rr(ctx, x0, y, W - pad * 2, row.h, 16); ctx.clip();
        ctx.fillStyle = TIER_COLORS[row.t].bg;
        ctx.fillRect(x0, y, labelW, row.h);
        ctx.restore();
        ctx.fillStyle = TIER_COLORS[row.t].fg;
        ctx.font = '800 84px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(row.t, x0 + labelW / 2, y + row.h / 2 + 4);

        // 카드
        row.items.forEach(function (m, i) {
          var col = i % perRow, r = Math.floor(i / perRow);
          var cx = x0 + labelW + inner + col * (cardW + gap);
          var cy = y + inner + r * (cellH + gap);

          ctx.save();
          rr(ctx, cx, cy, cardW, cardH, 8); ctx.clip();
          if (m.custom) {
            var cc = customColors(m.title);
            var g = ctx.createLinearGradient(cx, cy, cx + cardW, cy + cardH);
            g.addColorStop(0, cc[0]); g.addColorStop(1, cc[1]);
            ctx.fillStyle = g; ctx.fillRect(cx, cy, cardW, cardH);
            ctx.fillStyle = 'rgba(255,241,220,0.5)';
            ctx.font = '800 80px ' + FONT;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(firstChar(m.title), cx + cardW / 2, cy + cardH / 2 + 4);
          } else {
            ctx.drawImage(imgs[m.id], cx, cy, cardW, cardH);
          }
          ctx.restore();

          ctx.fillStyle = '#fff1dc';
          ctx.font = '700 20px ' + FONT;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          var lines = wrapLines(ctx, m.title, cardW + 8, 2);
          lines.forEach(function (ln, li) {
            ctx.fillText(ln, cx + cardW / 2, cy + cardH + 10 + li * 26);
          });
        });
        y += row.h + rowGap;
      });

      canvas.toBlob(function (blob) {
        if (!blob) { toast('이미지를 만들지 못했어요.'); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '내-영화-티어리스트.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        toast('이미지를 저장했어요.');
      }, 'image/png');
    }).catch(function () { toast('이미지를 만들지 못했어요.'); });
  }
  document.getElementById('saveImg').addEventListener('click', exportImage);

  /* ---------- 눈 장식 ---------- */
  (function snow() {
    var box = document.getElementById('snow');
    for (var i = 0; i < 22; i++) {
      var s = document.createElement('span');
      var size = 3 + Math.random() * 4;
      s.style.left = (Math.random() * 100) + '%';
      s.style.width = s.style.height = size + 'px';
      s.style.opacity = String(0.35 + Math.random() * 0.5);
      s.style.animationDuration = (9 + Math.random() * 12) + 's';
      s.style.animationDelay = (-Math.random() * 20) + 's';
      s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
      box.appendChild(s);
    }
  })();

  /* ---------- 시작 ---------- */
  checkStorage();
  load();
  render();
})();
</script>
</body>
</html>
